<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header class="flex justify-between items-center py-4 px-15 bg-indigo-500 text-black">
        <input type="text" placeholder="Pesquisar" class="w-100 h-10 pl-4 rounded-lg bg-white"/>
        <button type="button" class="leading-10 bg-green-800 duration-200 hover:bg-indigo-700 hover:text-black text-white px-4 py-2 rounded cursor-pointer">Nova Tarefa</button>
    
    </header>
    <main class="p-15 bg-gradient-to-bl from-rose-50 to-indigo-600">
        <h1 class="text-3xl font-bold mb-6">Tarefas</h1>
        <div id="tarefas" class="grid grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-lg shadow">
                <h3 class="font-bold mb-4">Titulo do card</h3>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Delectus temporibus neque fuga cumque nisi, magni aliquid minus. Placeat error impedit distinctio earum ipsum perspiciatis. Qui dicta a alias optio in.</p>
            </div>
        </div>
        <div id="overlay" class="w-full h-screen bg-black/70 fixed-top-0 left-0"></div>
        <div id="form-criar" class="w-100 p-4 rounded-lg bg-white">
            <form class="flex flex-col">
                <label for="titulo" class="uppercase text-xs font-bold mb-2 block">Titulo</label>
                <input type="text" placeholder="Titulo da tarefa" id="titulo"  class="pl-3 h-10 border-2 border-slate-400 focus:border-indigo-600 duration-150 rounded outline-none mb-4" required>
            </form>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
